name: Build IMBOSS Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build React UI as local WebView assets
        run: |
          npm install --prefix web-ui
          npm run build --prefix web-ui
          mkdir -p app/src/main/assets/home
          cp -R web-ui/dist/. app/src/main/assets/home/
          test -s app/src/main/assets/home/index.html
          test -s app/src/main/assets/home/app.js
          test -s app/src/main/assets/home/app.css
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IMBOSS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
